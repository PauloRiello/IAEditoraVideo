<!doctype html>
<!-- Composição mínima usada só para testar a instalação (HyperFrames + GSAP). Não faz parte do editor. -->
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=720" />
    <!-- GSAP local, copiado de node_modules pelo script de verificação: o teste funciona sem internet. -->
    <script src="assets/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1280px;
        height: 720px;
        overflow: hidden;
        background: #101820;
      }
      #root {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: sans-serif;
      }
      #titulo {
        color: #ffffff;
        font-size: 64px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="1"
      data-width="1280"
      data-height="720"
    >
      <h1 id="titulo" class="clip" data-start="0" data-duration="1" data-track-index="0">
        HyperFrames + GSAP
      </h1>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#titulo", { opacity: 0, x: -200 }, { opacity: 1, x: 0, duration: 0.8, ease: "power2.out" }, 0);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
