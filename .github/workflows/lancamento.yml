# Gera o instalador do Windows, instala num Windows de verdade, confere se o programa abre
# (teste de fumaça) e, só numa etiqueta de versão (v*), publica o lançamento que a
# atualização automática dos programas instalados procura.
# Em pedidos de integração e na execução manual, o instalador fica como artefato do fluxo.
name: Lançamento

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lancamento-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Dependências
        run: npm ci --no-audit --no-fund

      - name: Checagem de tipos
        run: npm run typecheck

      - name: Versão da etiqueta confere com o package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $versao = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$versao" -ne "${{ github.ref_name }}") { throw "A etiqueta ${{ github.ref_name }} não confere com a versão $versao do package.json." }

      - name: Gerar o instalador
        run: npx electron-builder --win --publish never

      - name: Instalar em silêncio
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist-aplicativo -Filter "IA-Editora-de-Video-Setup-*.exe" | Select-Object -First 1
          if (-not $setup) { throw "O instalador não foi gerado." }
          Start-Process -FilePath $setup.FullName -ArgumentList "/S" -Wait
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter "IA Editora de V*deo.exe" | Select-Object -First 1
          if (-not $exe) { throw "O programa instalado não foi encontrado em $env:LOCALAPPDATA\Programs." }
          "PROGRAMA=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Teste de fumaça no Windows
        shell: pwsh
        timeout-minutes: 40
        run: |
          $resultado = Join-Path $env:RUNNER_TEMP "fumaca.json"
          $p = Start-Process -FilePath $env:PROGRAMA -ArgumentList "--teste-de-fumaca", "--resultado=$resultado" -PassThru -Wait
          if (Test-Path $resultado) { Get-Content $resultado } else { Write-Host "Sem arquivo de resultado." }
          if ($p.ExitCode -ne 0 -or -not (Test-Path $resultado) -or -not (Get-Content $resultado -Raw | ConvertFrom-Json).ok) {
            throw "O programa instalado não abriu (código $($p.ExitCode))."
          }

      - name: Registro do programa
        if: always()
        shell: pwsh
        run: |
          $registro = Join-Path $env:LOCALAPPDATA "IAEditoraVideo\logs\aplicativo.log"
          if (Test-Path $registro) { Get-Content $registro -Tail 200 } else { Write-Host "Sem registro." }

      - name: Guardar o instalador
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: instalador-windows
          path: |
            dist-aplicativo/*.exe
            dist-aplicativo/latest.yml
          retention-days: 14

      - name: Publicar o lançamento
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $arquivos = Get-ChildItem dist-aplicativo -File | Where-Object { $_.Name -match '\.(exe|blockmap|yml)$' -and $_.Name -ne 'builder-debug.yml' } | ForEach-Object { $_.FullName }
          gh release create "${{ github.ref_name }}" @arquivos --title "IA Editora de Vídeo ${{ github.ref_name }}" --generate-notes
