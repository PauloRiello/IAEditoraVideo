# Opções do yt-dlp para este projeto.
# Uso: .venv/bin/yt-dlp --config-locations config/yt-dlp.conf URL

# Runtime de JavaScript exigido pelo YouTube (o Node.js já é requisito do projeto).
--js-runtimes node

# Destino e nome dos arquivos baixados.
--paths "Referências"
--output "%(title).100B [%(id)s].%(ext)s"

# MP4 de até 1080p, com áudio junto.
--format "bv*[height<=1080]+ba/b[height<=1080]/b"
--merge-output-format mp4

--no-playlist
--restrict-filenames
